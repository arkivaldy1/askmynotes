<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>AskMyNotes</title>
        <style>
            * { box-sizing: border-box; }

            body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 780px;
            margin: 0 auto;
            padding: 24px;
            background: #fafafa;
            color: #222;
            }

            header {
            border-bottom: 1px solid #ddd;
            padding-bottom: 16px;
            margin-bottom: 24px;
            }

            h1 { margin: 0 0 4px 0; font-size: 24px; }
            .subtitle { color: #666; font-size: 14px; }

            #chat {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 24px;
            }

            .message {
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 90%;
            }

            .message.user {
            background: #e0e7ff;
            align-self: flex-end;
            }

            .message.assistant {
            background: white;
            border: 1px solid #e5e5e5;
            align-self: flex-start;
            }

            .sources {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed #ccc;
            font-size: 12px;
            color: #666;
            }

            .sources ul { margin: 4px 0 0 0; padding-left: 18px; }

            .input-row {
            display: flex;
            gap: 8px;
            position: sticky;
            bottom: 0;
            background: #fafafa;
            padding: 12px 0;
            }

            #question {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            }

            button {
            padding: 10px 20px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            }

            button:disabled { background: #999; cursor: not-allowed; }

            .loading { color: #666; font-style: italic; }
            .error { color: #b91c1c; }
        </style>
    </head>
    <body>
        <header>
            <h1>AskMyNotes</h1>
            <div class="subtitle">Ask questions about your personal knowledge base</div>
        </header>

        <div id="chat"></div>

        <div class="input-row">
            <input
                id="question"
                type="text"
                placeholder="Ask a question about your notes..."
                autocomplete="off"
            />

            <button id="ask-btn">Ask</button>
        </div>
            <script>
                document.addEventListener("DOMContentLoaded", () => {
                const API_URL = "http://127.0.0.1:8000";

                const chatEl = document.getElementById("chat");
                const inputEl = document.getElementById("question");
                const btnEl = document.getElementById("ask-btn");

                function addMessage(role, text) {
                const div = document.createElement("div");
                div.className = `message ${role}`;
                div.textContent = text;
                chatEl.appendChild(div);
                div.scrollIntoView({ behavior: "smooth", block: "end" });
                return div;
                }

                function addAssistantMessage(answer, sources) {
                const div = document.createElement("div");
                div.className = "message assistant";

                const textEl = document.createElement("div");
                textEl.textContent = answer;
                div.appendChild(textEl);

                if (sources && sources.length > 0) {
                    const sourcesEl = document.createElement("div");
                    sourcesEl.className = "sources";
                    sourcesEl.innerHTML = "<strong>Sources:</strong>";

                    const ul = document.createElement("ul");
                    for (const s of sources) {
                    const li = document.createElement("li");
                    li.textContent = `${s.source} (chunk ${s.chunk_index}, distance ${s.distance.toFixed(3)})`;
                    ul.appendChild(li);
                    }
                    sourcesEl.appendChild(ul);
                    div.appendChild(sourcesEl);
                }

                chatEl.appendChild(div);
                div.scrollIntoView({ behavior: "smooth", block: "end" });
                }

                async function askQuestion() {
                const question = inputEl.value.trim();
                if (!question) return;

                addMessage("user", question);
                inputEl.value = "";

                btnEl.disabled = true;
                const loadingEl = addMessage("assistant", "Thinking...");
                loadingEl.classList.add("loading");

                try {
                    const response = await fetch(`${API_URL}/ask`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question, top_k: 3 }),
                    });

                    if (!response.ok) {
                    const err = await response.json().catch(() => ({}));
                    throw new Error(err.detail || `HTTP ${response.status}`);
                    }

                    const data = await response.json();
                    loadingEl.remove();
                    addAssistantMessage(data.answer, data.sources);
                } catch (error) {
                    loadingEl.textContent = `Error: ${error.message}`;
                    loadingEl.classList.remove("loading");
                    loadingEl.classList.add("error");
                } finally {
                    btnEl.disabled = false;
                    inputEl.focus();
                }
                }

                btnEl.addEventListener("click", askQuestion);

                inputEl.addEventListener("keydown", (e) => {
                if (e.key === "Enter" && !e.shiftKey) {
                    e.preventDefault();
                    askQuestion();
                }
                });

                inputEl.focus();
            });
        </script>
    </body>
</html>
